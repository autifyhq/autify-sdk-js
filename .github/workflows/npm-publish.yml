name: Publish to npm

# Dispatched by release-publish.yml, pinned to the release tag. Run manually to
# recover a failed publish: gh workflow run npm-publish.yml --ref vX.Y.Z
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # https://github.com/jdx/mise-action/releases/tag/v4.0.1
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151
      - run: npm ci
      - run: npm run test
      - run: npm publish --access=public
