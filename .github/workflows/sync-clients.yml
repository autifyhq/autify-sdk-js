name: Sync generated clients

# Regenerates a client when its API spec changes upstream and opens a PR.
#
# Triggered by the source repos (see the sender workflows in autify-api and
# mobile-web) or by hand. Merging the PR does not publish — release-publish.yml
# no-ops unless the version has no tag yet — so regeneration and releasing stay
# decoupled. See RELEASING.md.
#
# Both services work the same way: their specs are published, so each job
# downloads its own and needs no credentials.
#
#   web    - core-web publishes a sanitised copy to autify-api, served at
#            autifyhq.github.io/autify-api/swagger.yml.
#   mobile - mobile-web serves its spec through rswag-ui at
#            mobile-app.autify.com/api/docs/v1/swagger.yaml.
#
# Because both jobs pull rather than being handed anything, either can be re-run
# at any time and will converge on what is published. The weekly schedule is the
# floor: it needs no credentials and cannot race a publish, since it simply reads
# whatever is served at the time. Dispatches only make it faster, so a missed one
# costs latency rather than leaving the client silently stale — which is exactly
# how the mobile client fell a year behind.

on:
  schedule:
    # Monday 00:00 UTC (09:00 JST). Produces no PR when nothing changed.
    - cron: "0 0 * * 1"
  repository_dispatch:
    types: [web-spec-updated, mobile-spec-updated]
  workflow_dispatch:
    inputs:
      service:
        description: "Which client to regenerate"
        type: choice
        default: web
        options:
          - web
          - mobile

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-clients-${{ github.event.action || inputs.service || 'scheduled' }}
  cancel-in-progress: false

jobs:
  web:
    name: Regenerate the web client
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'web-spec-updated') ||
      (github.event_name == 'workflow_dispatch' && inputs.service == 'web')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      # generate:client:web downloads the published swagger itself. The two
      # fixups are the rest of what the umbrella `generate` script does —
      # skipping fix-html-escape is what left `&#39;` in the output historically.
      - name: Regenerate
        run: |
          npm run generate:client:web
          npm run fix-html-escape
          npm run format

      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          base: main
          branch: chore/sync-web-client
          delete-branch: true
          title: "Sync the web client with the Autify Web API"
          commit-message: "Sync the web client with the Autify Web API"
          body: |
            Regenerated from the published web swagger by `sync-clients.yml`.

            Check the type diff before merging: a removed or renamed property is
            a breaking change for consumers even when runtime behaviour is
            unchanged.

            Merging does not publish — cut a release afterwards if this should
            ship. See RELEASING.md.

  mobile:
    name: Regenerate the mobile client
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'mobile-spec-updated') ||
      (github.event_name == 'workflow_dispatch' && inputs.service == 'mobile')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      # generate:client:mobile downloads the published spec, converts it to the
      # OpenAPI 3 shape this SDK publishes, and lays swagger-mobile-overlay.yml
      # over it. See scripts/buildMobileSpec.ts.
      - name: Regenerate
        run: |
          npm run generate:client:mobile
          npm run fix-html-escape
          npm run format

      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          base: main
          branch: chore/sync-mobile-client
          delete-branch: true
          title: "Sync the mobile client with the Autify for Mobile API"
          commit-message: "Sync the mobile client with the Autify for Mobile API"
          body: |
            Regenerated from mobile-web's published spec by `sync-clients.yml`.

            Check the type diff before merging: a removed or renamed property is
            a breaking change for consumers even when runtime behaviour is
            unchanged.

            If a property disappeared that the SDK should keep, mobile-web
            probably does not document it — add it to
            `swagger-mobile-overlay.yml` rather than editing `swagger-mobile.yml`,
            which is generated.

            Merging does not publish — cut a release afterwards if this should
            ship. See RELEASING.md.
