name: Sync generated clients

# Regenerates a client from its published spec and opens a PR. Merging does not
# publish; cut a release afterwards. See RELEASING.md.
#
# Actions are pinned the way the rest of .github/workflows does it: first-party
# actions/* by tag, third-party by commit SHA.

on:
  # No source repo sends these yet -- see RELEASING.md. The trigger is here so
  # wiring core-web / mobile-web up is a one-sided change when we get to it;
  # until then this workflow is manual.
  repository_dispatch:
    types: [web-spec-updated, mobile-spec-updated]
  workflow_dispatch:
    inputs:
      service:
        description: "Which client to regenerate"
        type: choice
        default: web
        options:
          - web
          - mobile

permissions:
  contents: write
  pull-requests: write

# Keyed on the service, not the event: a dispatch and a manual run of the same
# service would otherwise land in different groups and race to force-push the
# same chore/sync-*-client branch, with the loser silently overwritten.
concurrency:
  group: sync-clients-${{ inputs.service || (github.event.action == 'web-spec-updated' && 'web' || 'mobile') }}
  cancel-in-progress: false

jobs:
  web:
    name: Regenerate the web client
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.action == 'web-spec-updated') ||
      (github.event_name == 'workflow_dispatch' && inputs.service == 'web')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      - run: npm ci

      - name: Regenerate
        run: |
          npm run generate:client:web
          npm run fix-html-escape
          npm run format

      # create-pull-request no-ops silently when nothing moved, which reads as
      # "the PR step ran and there is no PR". Decide it here instead: the steps
      # below then show as skipped, and the summary says which case it was.
      - name: Check for unsynced changes
        id: drift
        run: |
          set -euo pipefail
          # --porcelain, not `git diff`: a file the generator newly emits is
          # untracked, and `git diff` cannot see it. Scoped to what this
          # generator owns, since `npm run format` above is a repo-wide prettier.
          CHANGED="$(git status --porcelain -- swagger-web.yml src/generated/web)"
          if [ -z "$CHANGED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing to sync — the web client already matches its published spec."
            {
              echo "## Nothing to sync"
              echo ""
              echo "\`npm run generate:client:web\` reproduced the checked-in web client exactly, so there is no PR to open."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "$CHANGED"
          git --no-pager diff --stat -- swagger-web.yml src/generated/web

      # build-test.yml does not run on a PR opened with GITHUB_TOKEN, so this is
      # the only gate the sync PR gets. Without it an upstream spec change that
      # breaks the build -- a newly required property, say -- opens a PR that
      # looks mergeable and reds main.
      - name: Validate the regenerated client
        if: steps.drift.outputs.changed == 'true'
        run: |
          npm run lint
          npm run build
          npm test

      - name: Open the sync PR
        id: pr
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          base: main
          branch: chore/sync-web-client
          delete-branch: true
          # npm run format is a repo-wide prettier --write; without add-paths the
          # action would sweep every file it touched into this PR.
          add-paths: |
            swagger-web.yml
            src/generated/web
          title: "Sync the web client with the Autify Web API"
          commit-message: "Sync the web client with the Autify Web API"
          body: |
            Regenerated from the published web swagger by `sync-clients.yml`.

            Check the type diff before merging: a property that was removed,
            renamed, or newly made required is a breaking change for consumers
            even when runtime behaviour is unchanged — release it as a minor
            bump, not a patch.

            Merging does not publish — cut a release afterwards if this should
            ship. See RELEASING.md.

      - name: Report the sync PR
        if: steps.drift.outputs.changed == 'true'
        env:
          URL: ${{ steps.pr.outputs.pull-request-url }}
          OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
        run: |
          {
            echo "## The web client is behind its published spec"
            echo ""
            echo "**PR ($OPERATION):** $URL"
          } >> "$GITHUB_STEP_SUMMARY"

  mobile:
    name: Regenerate the mobile client
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.action == 'mobile-spec-updated') ||
      (github.event_name == 'workflow_dispatch' && inputs.service == 'mobile')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      - run: npm ci

      - name: Regenerate
        run: |
          npm run generate:client:mobile
          npm run fix-html-escape
          npm run format

      # create-pull-request no-ops silently when nothing moved, which reads as
      # "the PR step ran and there is no PR". Decide it here instead: the steps
      # below then show as skipped, and the summary says which case it was.
      - name: Check for unsynced changes
        id: drift
        run: |
          set -euo pipefail
          # --porcelain, not `git diff`: a file the generator newly emits is
          # untracked, and `git diff` cannot see it. Scoped to what this
          # generator owns, since `npm run format` above is a repo-wide prettier.
          CHANGED="$(git status --porcelain -- swagger-mobile.yml src/generated/mobile)"
          if [ -z "$CHANGED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing to sync — the mobile client already matches its published spec."
            {
              echo "## Nothing to sync"
              echo ""
              echo "\`npm run generate:client:mobile\` reproduced the checked-in mobile client exactly, so there is no PR to open."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "$CHANGED"
          git --no-pager diff --stat -- swagger-mobile.yml src/generated/mobile

      # See the web job: this is the only gate a bot-opened PR gets.
      - name: Validate the regenerated client
        if: steps.drift.outputs.changed == 'true'
        run: |
          npm run lint
          npm run build
          npm test

      - name: Open the sync PR
        id: pr
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          base: main
          branch: chore/sync-mobile-client
          delete-branch: true
          add-paths: |
            swagger-mobile.yml
            src/generated/mobile
          title: "Sync the mobile client with the Autify for Mobile API"
          commit-message: "Sync the mobile client with the Autify for Mobile API"
          body: |
            Regenerated from mobile-web's published spec by `sync-clients.yml`.

            Check the type diff before merging: a property that was removed,
            renamed, or newly made required is a breaking change for consumers
            even when runtime behaviour is unchanged — release it as a minor
            bump, not a patch.

            If a property disappeared that the SDK should keep, mobile-web
            probably does not document it — add it to
            `swagger-mobile-overlay.yml` rather than editing `swagger-mobile.yml`,
            which is generated.

            Merging does not publish — cut a release afterwards if this should
            ship. See RELEASING.md.

      - name: Report the sync PR
        if: steps.drift.outputs.changed == 'true'
        env:
          URL: ${{ steps.pr.outputs.pull-request-url }}
          OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
        run: |
          {
            echo "## The mobile client is behind its published spec"
            echo ""
            echo "**PR ($OPERATION):** $URL"
          } >> "$GITHUB_STEP_SUMMARY"
