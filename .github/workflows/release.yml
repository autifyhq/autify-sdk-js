name: Prepare release

# Bump the version and open a "Release X.Y.Z" PR. Merging it triggers
# release-publish.yml, which tags, releases, and publishes to npm. See RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump (ignored if 'version' is set)"
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: "Explicit version e.g. 1.2.3 (overrides bump; no leading v)"
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          # Full history and tags: the PR body lists the commits since the
          # previous tag, and a shallow checkout has neither.
          fetch-depth: 0

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Install dependencies
        run: npm ci

      # A release must not be the first place an upstream API change appears: the
      # bump is chosen at dispatch, before any client diff exists, so a release
      # that quietly carried one would ship a breaking change under whatever bump
      # happened to be picked. Regenerate, and fail if anything moved -- the sync
      # PR then lands on its own, reviewed, and the release stays a version bump.
      - name: Check the generated clients are up to date
        run: |
          set -euo pipefail
          npm run generate
          # `npm run generate` ends in a repo-wide `prettier --write`, so scope the
          # check to what the generators own. --porcelain, not `git diff`: a file
          # the generator newly emits is untracked, and `git diff` cannot see it.
          CHANGED="$(git status --porcelain -- swagger-web.yml swagger-mobile.yml src/generated)"
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED"
            git --no-pager diff --stat -- swagger-web.yml swagger-mobile.yml src/generated
            echo "::error::The generated clients are behind their published specs. Run the 'Sync generated clients' workflow for each service that moved, review and merge its PR, then re-run this release with the bump that diff turns out to warrant."
            exit 1
          fi

      - name: Validate lint, build & tests before cutting a release
        run: |
          npm run lint
          npm run build
          npm test

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          CURRENT="$(node -p "require('./package.json').version")"
          VERSION_INPUT="${VERSION_INPUT#v}"   # tolerate an accidental leading "v"
          if [ -n "$VERSION_INPUT" ]; then
            npm version "$VERSION_INPUT" --no-git-tag-version
          else
            npm version "$BUMP" --no-git-tag-version
          fi
          VERSION="$(node -p "require('./package.json').version")"
          # Refuse a downgrade or no-op: an explicit `version` input bypasses the
          # monotonic bump, and `npm publish` sets `latest` with no semver check,
          # so a lower version would repoint every install at an older build.
          if ! node -e '
            const cmp = (a, b) => {
              const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
              for (let i = 0; i < 3; i++) {
                if (pa[i] > pb[i]) return 1;
                if (pa[i] < pb[i]) return -1;
              }
              return 0;
            };
            process.exit(cmp(process.argv[1], process.argv[2]) > 0 ? 0 : 1);
          ' "$VERSION" "$CURRENT"; then
            echo "::error::New version $VERSION is not greater than current $CURRENT — refusing to downgrade or re-release."
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "branch=release/v$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Guard against an existing release
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists — $TAG has already been released."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch $BRANCH already exists — a release PR for this version is already open."
            exit 1
          fi

      # The PR's own diff is only the version bump, so on its own it says nothing
      # about what the release actually carries. Spell it out: the commits since
      # the previous tag, and whether the generated client surface moved -- the
      # latter is what decides whether the bump picked at dispatch was right.
      - name: Collect what this release ships
        id: changes
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release-changes.md"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [ -z "$PREV_TAG" ]; then
            echo "No previous \`vX.Y.Z\` tag, so there is nothing to compare against." > "$NOTES"
            exit 0
          fi

          {
            echo "## What this ships"
            echo ""
            echo "Everything merged since \`$PREV_TAG\` — [full compare](https://github.com/$REPO/compare/$PREV_TAG...main):"
            echo ""
            git log --reverse --pretty='- %s' "$PREV_TAG"..HEAD
          } > "$NOTES"

          # Call the generated clients out separately: they are what consumers
          # compile against, so a property removed, renamed or newly made
          # required here is the difference between a minor and a patch.
          CLIENT_DIFF="$(git --no-pager diff --stat "$PREV_TAG"..HEAD -- swagger-web.yml swagger-mobile.yml src/generated)"
          {
            echo ""
            if [ -z "$CLIENT_DIFF" ]; then
              echo "The generated clients are untouched since \`$PREV_TAG\`."
            else
              echo "### The generated client surface moved"
              echo ""
              echo "Check the type diff before merging: a property that was removed, renamed, or"
              echo "newly made required is a breaking change for consumers even when runtime"
              echo "behaviour is unchanged."
              echo ""
              echo '```'
              echo "$CLIENT_DIFF"
              echo '```'
            fi
          } >> "$NOTES"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          REPO: ${{ github.repository }}
          CHANGES: ${{ steps.changes.outputs.notes }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json
          # --no-verify: npm ci installed husky, whose pre-commit runs lint-staged
          # over the staged lockfile — pure waste (and a latent failure) on a bot
          # commit that only touches version metadata.
          git commit --no-verify -m "Release $VERSION"
          git push --set-upstream origin "$BRANCH"

          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release $VERSION" \
            --body "$(cat <<EOF
          Automated release PR opened by the \`Prepare release\` workflow.

          - Bumps \`package.json\` + \`package-lock.json\` to **$VERSION**.
          - The generated clients were checked against the published specs and
            are up to date, so this PR's own diff is only the version bump.
          - \`npm run lint\`, \`npm run build\` and \`npm test\` passed in the prepare job (the \`pull_request\` build-test checks do not run on bot-opened PRs).

          $(cat "$CHANGES")

          ## After merging

          **Rebase-merge** this PR — that is the only manual step. On merge,
          \`release-publish.yml\` tags \`$TAG\`, creates the GitHub Release with
          generated notes, and triggers \`npm-publish.yml\` to publish **$VERSION**
          to npm via OIDC.

          Watch the publish: <https://github.com/$REPO/actions/workflows/npm-publish.yml>

          _See RELEASING.md for the full runbook._
          EOF
          )")"

          echo "Opened $PR_URL"
          {
            echo "## 🚀 Release $VERSION prepared"
            echo ""
            echo "**PR:** $PR_URL"
            echo ""
            echo "### Next step"
            echo "**Rebase-merge** the PR above — that is the only manual step."
            echo "Merging tags \`$TAG\`, creates the GitHub Release, and publishes $VERSION to npm automatically."
            echo ""
            echo "Watch the publish: <https://github.com/$REPO/actions/workflows/npm-publish.yml>"
          } >> "$GITHUB_STEP_SUMMARY"
