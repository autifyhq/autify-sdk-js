name: Release on version bump

# On a version bump landing on main, tag + create the GitHub Release, then
# publish to npm. npm-publish.yml is dispatched (not left to the release event)
# because a GITHUB_TOKEN-created Release does not re-trigger workflows. See
# RELEASING.md.

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write
  actions: write

# No concurrency group on purpose: each run is pinned to its own commit SHA
# (checkout + release target + publish all use github.sha), so runs are
# idempotent and independent. A concurrency group would instead cancel a
# *pending* run when a newer one queues, silently dropping a release that
# merged in the middle of a burst.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve version
        id: v
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: check
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG already exists — this push did not bump the version, nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Pin the release to the pushed commit (not `main`, which may have already
      # advanced to a later release) so bursty merges each tag their own commit.
      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          TARGET: ${{ github.sha }}
        run: gh release create "$TAG" --target "$TARGET" --title "$TAG" --generate-notes

      # Pin the publish to the tag we just created so a later merge can't shift
      # what gets published out from under it, and wait for it so a failed
      # npm publish fails this run instead of leaving a green release with
      # nothing on npm.
      - name: Trigger npm publish (pinned to the tag) and wait
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run npm-publish.yml --ref "$TAG"
          # gh doesn't return the dispatched run id, so poll for the run whose
          # ref is this tag (unique per release) before watching it.
          RUN_ID=""
          for _ in $(seq 1 20); do
            RUN_ID="$(gh run list --workflow=npm-publish.yml --branch="$TAG" \
              --limit=1 --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$RUN_ID" ] && break
            sleep 3
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::Could not find the dispatched npm-publish run for $TAG."
            exit 1
          fi
          gh run watch "$RUN_ID" --exit-status

      - name: Summary
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## 🚀 Released $TAG"
            echo ""
            echo "- Created GitHub Release **$TAG** with generated notes."
            echo "- Published **$VERSION** to npm via \`npm-publish.yml\` (OIDC) and waited for it to succeed."
            echo ""
            echo "Publish run: <https://github.com/$REPO/actions/workflows/npm-publish.yml>"
          } >> "$GITHUB_STEP_SUMMARY"
