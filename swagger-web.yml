    CreateScenarioRequest:
      properties:
        name:
          type: string
          description: |
            Name of the scenario, unique within the project. Omit it to have a
            default name generated.
        description:
          type: string
        labels:
          type: array
          description: |
            Label names to attach, matched against this project's labels in the same
            way as `labels` on `updateScenario`. A name this project does not already
            have is created in it, unless `on_create` is false.
          items:
            type: string
        on_create:
          type: boolean
          default: true
          description: |
            Whether to create a label named in `labels` that this project does not
            have. Set it to false to have an unrecognised name rejected instead. Only
            `true` and `false` are accepted, as booleans or as the strings `"true"`
            and `"false"`.
    UpdateScenarioRequest:
      properties:
        version_token:
          type: string
          description: |
            The version of the scenario you are updating, as returned by `version_token`
            when you read it. The update is rejected with 412 if anyone changed the
            scenario's name, description, labels or steps in between, so read it again and retry
            against the version you get back. Running the scenario or reviewing its results does not change it. Sending an empty value is an error; omit the field entirely to update
            whatever is there without checking.
        name:
          type: string
        description:
          type: string
        labels:
          type: array
          description: |
            Label names, replacing the scenario's current labels. A name this project
            does not already have is created in it, unless `on_create` is false.

            Only this project's labels are matched, so a label of the same name in
            another project is never attached.
          items:
            type: string
        on_create:
          type: boolean
          default: true
          description: |
            Whether to create a label named in `labels` that this project does not
            have. Set it to false to have an unrecognised name rejected instead,
            which is the safer setting when a name may be a typo.

            Only `true` and `false` are accepted, as booleans or as the strings
            `"true"` and `"false"`. Any other value is rejected with 400 rather than
            being read as `true`, so a typo in this flag cannot
            silently turn label creation back on. A repeated name in `labels` is
            attached once. A name the project would have to create but that the
            label validations reject, such as one over 50 characters, is a 400
            carrying the validation message.
    RestoreScenarioHistoryRequest:
      properties:
        version_token:
          type: string
          description: |
            The version of the scenario you are restoring, as returned by
            `version_token` when you read it. The restore is rejected with 412 if
            anyone changed the scenario's name, description, labels or steps in
            between. Running the scenario or reviewing its results does not change
            it. Sending an empty value is an error; omit the field entirely to
            restore over whatever is there without checking.
    ReplaceScenarioStepsRequest:
      required:
        - steps
      properties:
        version_token:
          type: string
          description: |
            The version of the scenario you are writing, as returned by `version_token`
            when you read it. The write is rejected with 412 if anyone changed the
            scenario's name, description, labels or steps in between. Running the
            scenario or reviewing its results does not change it. Sending an empty value is an error; omit the
            field entirely to write whatever is there without checking.
        steps:
          type: array
          description: |
            Every step of the scenario, in the order they should run. Each is an
            object with the fields of a `describeScenario` step:

            - `id`: an existing step's id. Leave it out to add a step.
            - `action_type`: required for a new step, from `listStepKeywords`.
            - `name`, `memo`: strings. `null` clears them to empty.
            - `on_failure`: `abort`, `continue` or `ignore`. `null` resets it to `abort`.
            - `step_execution_type`: `scenario_step` or `cleanup_step`.
            - `arguments`: a list of `{"name": ..., <fields>}`, matched by name. A
              `text` or `url` argument takes `value`, a string, or `true`/`false` for
              the switches of `Assert File Download`. An `element` argument takes
              `user_locator` and `user_locator_heals`. A `step_group` argument takes
              `step_group_id`, the id of a step group in this project, and
              `overrides`, described below. A function
              argument of an `Execute Javascript` step takes `value`, a string,
              which replaces any data table column, variable or address group the
              argument read before. Where the step's custom action declares the
              argument an integer, the string must hold one, such as `"7"`.
              `"value": null` removes the function argument. A name the step lacks
              adds one, after the others, on an existing step or a new one. Its
              code reads the argument as a parameter of that name, so the name must
              be a JavaScript identifier, not a reserved word, not a name the step
              uses already, and not one of the keyword's argument names in any
              case, such as `element`.

            `user_locator` is a CSS or XPath selector with a mandatory `css:` or
            `xpath:` prefix, and a new element needs one. Set `user_locator_heals` to
            true to have Autify find the element by it on the next passing run, learn
            the element from that run, and match it automatically from then on, the
            way a recorded step is matched; the selector then only has to be
            unambiguous now, not survive later page changes. Left false, the selector
            is a pin used on every run. Sending `user_locator: null` clears it, so the
            step goes back to matching the element automatically. For a keyword that
            needs its element, that is refused with 400 while the element has learned
            nothing to match it by, as on a step whose `candidate_locators` are still
            empty because it has not passed a run yet.

            Read only, and ignored when sent: `element_id`, `seed_locator`,
            `candidate_locators` and `assign`. A new `Execute Javascript`
            or `Open Window` step is given a generated `assign`; copy it from the
            response if another step refers to it. A `file` argument is read only, and
            sending a different file value is rejected. A value read back as `******`
            from a password field is treated as unchanged while the step keeps its
            keyword. Changing such a step's `action_type` needs the real value sent
            for that argument, and is rejected with 400 otherwise.

            `overrides` is a merge patch like the rest: an object keyed by the id
            of a step inside the group, each with `arguments` in the shape
            `describeScenario` reads back. Send only the arguments you change. An
            argument's `value` replaces what the group passes to that step, and
            `null` reverts it to the group's own value. A step id sent as `null`
            reverts all of that step's arguments, and `overrides: null` reverts
            every one. An `Execute Javascript` step's function arguments are
            named as its code refers to them. Only what the scenario editor lets
            a call site override is writable. Anything else is rejected with 400,
            including an element or a file and a step whose custom action was
            selected at the call site.
            Pointing the call site at another group drops its overrides before
            any you send apply.

            Not writable here: `Choose File` and `Open Email With Title` steps, which
            can only be recorded; the code of an `Execute Javascript` step that runs a
            custom action; the function arguments a custom action defines, beyond
            their values; and an element added to an existing `Execute Javascript`
            step that has none. To add an element, send the step without its `id`,
            with its function arguments, to replace it. A step sent without its
            `id` is new, so every value it carries is literal: an argument
            `describeScenario` reads as an email address group's identifier
            reaches the step as that identifier, not as an address from the group.
          items:
            type: object
tags:
  - name: schedule
    description: '"Schedule" is called as "Test Plan" now.

      '
