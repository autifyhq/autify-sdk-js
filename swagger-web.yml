        This endpoint works only for organizations on credit-based plans. It always returns 0 for `credits_consumed` and `credit_consumption_event_count` if your organization is on a run-based plan.
      tags:
        - credit
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          description:
            "For example, 1 for the following URL: https://app.autify.com/projects/1/credits

            "
          schema:
            type: integer
        - name: date_from
          in: query
          required: false
          description: |
            The date to start counting used credits from.\
            If not specified, the date will be set to 1 week ago.\
            Up to 90 days in advance can be specified. If the specified date is more than 90 days in the past, the date will be set to 90 days ago.\
            Date must follow the format YYYY-MM-DD (example: "2023-09-21").
          schema:
            type: string
            format: date
            example: "2023-09-21"
        - name: date_to
          in: query
          required: false
          description: |
            The date to end counting used credits from.\
            If not specified, the date will be set to today.\
            Date must follow the format YYYY-MM-DD (example: "2023-09-28").
          schema:
            type: string
            format: date
            example: "2023-09-28"
        - name: scenario_id
          in: query
          required: false
          description: "The scenario ID to filter used credits by.

            "
          schema:
            type: integer
        - name: test_plan_id
          in: query
          required: false
          description: "The test plan ID to filter used credits by.

            "
          schema:
            type: integer
        - name: user_id
          in: query
          required: false
          description:
            "The user ID that executed tests to filter used credits by.

            "
          schema:
            type: integer
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                "$ref": "#/components/schemas/UsedCredits"
  "/projects":
    get:
      operationId: listProjects
      description:
        "List the projects (workspaces) the access token's user is a member
        of, plus their partner's workspaces for a partner admin, ordered by id.

        "
      tags:
        - project
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Project"
  "/projects/{project_id}/project_info":
    get:
      operationId: getProjectInfo
      description: "Get project information.

        "
      tags:
        - project
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          description:
            "For example, 1 for the following URL: https://app.autify.com/projects/1/project_info

            "
          schema:
            type: integer
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                "$ref": "#/components/schemas/ProjectInfo"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: http
  schemas:
    Scenario:
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        author:
          "$ref": "#/components/schemas/User"
        updater:
          "$ref": "#/components/schemas/User"
        labels:
          type: array
          items:
            "$ref": "#/components/schemas/Label"
    ScenarioDetail:
      properties:
        id:
          type: integer
        version_token:
          type: string
          description: |
            Opaque version of the scenario as returned. Send it back as `version_token` on
            an update to have that update rejected if the scenario changed in between.
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        author:
          "$ref": "#/components/schemas/User"
        updater:
          "$ref": "#/components/schemas/User"
        description:
          type: string
        project_url:
          type: string
        steps:
          type: array
          description: "The scenario's steps, in execution order.

            "
          items:
            "$ref": "#/components/schemas/ScenarioStep"
        data_table:
          type: array
          description: "The scenario's data table, one entry per row.

            "
          items:
            type: object
        variables:
          "$ref": "#/components/schemas/ScenarioVariables"
        labels:
          type: array
          items:
            "$ref": "#/components/schemas/Label"
    ScenarioStep:
      properties:
        id:
          type: integer
          nullable: true
          description: |
            Identifier of the step. `describeScenario` always fills it. Only
            `describeScenarioHistory` can return null, for an entry saved before
            late July 2024, when history entries started recording step ids.
        action_type:
          type: string
          nullable: true
          description: |
            The step's keyword in enum form, for example `INPUT_TEXT`. This is the
            same value the write API takes, and the `action_type` `listStepKeywords`
            publishes. Null for a legacy keyword that has no enum member.
        name:
          type: string
          description: The step's name, as shown in the scenario editor.
        memo:
          type: string
        on_failure:
          type: string
          enum:
            - abort
            - continue
            - ignore
          description: What the run does when this step fails.
        step_execution_type:
          type: string
          enum:
            - scenario_step
            - cleanup_step
          description: |
            Whether the step runs as part of the scenario or as a cleanup step
            afterwards.
        assign:
          type: string
          nullable: true
          description: |
            The identifier this step's result is assigned to. Two kinds of value
            appear here. A step that an export variable reads from carries that
            variable's key, which you chose. A JavaScript step instead carries a
            generated key shaped `${<32 hex characters>}`, which is machine-owned:
            copy it verbatim and do not invent one. An `assign` does not imply that
            an export variable exists for the step.
        arguments:
          type: array
          description: |
            The step's arguments, in the order `listStepKeywords` gives them for
            this keyword. Optional arguments the step does not set are absent, so
            match an argument by its `name` rather than by position.

            A run's steps carry the same names and types, under `ResultStepArgument`,
            with a different arity: this endpoint leaves out an optional argument the
            step never set, while a run emits every slot its keyword declares. There a
            `file` argument reports just `file_name`, and `step_group` appears only
            here. A run lists an `Execute Javascript` step's function arguments
            after its keyword's arguments with a null `name`, in the order the
            code reads them.
          items:
            "$ref": "#/components/schemas/ScenarioStepArgument"
    ScenarioStepArgument:
      description:
        "An argument to a step. Which fields are present depends on `type`.

        "
      properties:
        name:
          type: string
          nullable: true
          description: |
            Name of the argument, matching the `name` `listStepKeywords` publishes
            for this keyword's argument in the same slot. An `Execute Javascript`
            step's function arguments follow its keyword's arguments, each named
            as the step's code refers to it.
        type:
          type: string
          enum:
            - text
            - url
            - file
            - element
            - step_group
          description: |
            `text` and `url` carry `value`. `file` carries `file_name`,
            `file_size` and `object_key`. `element` carries `element_id`,
            `user_locator`, `user_locator_heals`, `seed_locator` and
            `candidate_locators`. `step_group` carries `step_group_id` and
            `overrides`.
        value:
          description: |
            The value, for a `text` or `url` argument. A value typed into a
            password field is returned as `******`.
          oneOf:
            - type: string
            - type: boolean
        element_id:
          type: integer
          nullable: true
          description: |
            Identifier of the element this step targets. Read only.
            `describeScenario` always fills it. `describeScenarioHistory` always
            returns null, because a history entry never records element ids.
        user_locator:
          type: string
          nullable: true
          description: |
            The CSS or XPath selector pinned to this element, if one is set. The
            `css:` or `xpath:` prefix is part of the value.
        user_locator_heals:
          type: boolean
          nullable: true
          description: |
            Whether `user_locator` is a seed rather than a pin. When true, the next
            run finds the element by `user_locator`, Autify learns the element from
            that run, and later runs match it automatically as if it had been
            recorded, so a page change no longer breaks the step. When false, every
            run uses `user_locator` and nothing else. `describeScenario` always
            fills it; `describeScenarioHistory` returns null, because a history
            entry does not record it.
        seed_locator:
          type: string
          nullable: true
          description: |
            The `user_locator` Autify last learned the element from. Read only. It
            equals `user_locator` once a run has learned the element; when the two
            differ, the next run uses `user_locator` again and relearns from it.
        candidate_locators:
          type: array
          nullable: true
          description: |
            The locators Autify generated for this element on its last passing
            run, which is how the step is matched when no `user_locator` is set.
            Read only, and empty until the scenario has passed once. `null` when
            the step was recorded on a password field, which withholds them.
          items:
            type: string
        file_name:
          type: string
          nullable: true
        file_size:
          type: integer
          nullable: true
        object_key:
          type: string
          nullable: true
        step_group_id:
          type: integer
          nullable: true
          description: |
            The step group this step runs. Read it with `describeScenario` using
            this id.
        overrides:
          type: object
          description: |
            The values this call site substitutes into the step group, keyed by
            the id of the step inside the group that each one applies to. An
            empty object means this endpoint reports no override for the group,
            which is not the same as the group running as authored. A custom
            action selected for an `Execute Javascript` step at the call site is
            never reported, and neither are that step's other overrides.
            `replaceScenarioSteps` writes these in the same shape.
          additionalProperties:
            type: object
            properties:
              arguments:
                type: array
                description: |
                  Only the arguments this call site overrides, named as
                  `listStepKeywords` names them for the overridden step's
                  keyword. Match by `name`: an argument left as the group
                  authored it is absent, as is one whose stored override
                  repeats the authored value and so substitutes nothing. An
                  argument that names an element is absent too, because a run
                  locates the element the step group authored and ignores
                  anything a call site stores against that argument. An
                  `Execute Javascript` step's changed function arguments
                  follow, named as its code refers to them.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      nullable: true
                    type:
                      type: string
                      enum:
                        - text
                        - url
                      description: |
                        The kind of the substituted value: `url` where the
                        overridden argument names a page, `text` otherwise.
                    value:
                      oneOf:
                        - type: string
                        - type: boolean
                      description: |
                        The substituted value. Where the overridden step was
                        recorded on a password field this is `******`, as it is
                        when the step group itself is read.
    StepSearchHit:
      description: |
        A step whose arguments contain the searched text. Exactly one of
        `scenario` and `step_group` is set, naming where the step is.
      properties:
        step_id:
          type: integer
          description: The step's `id`, as `describeScenario` returns it.
        step_index:
          type: integer
          description: |
            The step's position, counting from 0, in the `steps` that
            `describeScenario` returns for its scenario or step group.
        scenario:
          type: object
          nullable: true
          description: The scenario the step is in, or null for a step group's step.
          properties:
            id:
              type: integer
            name:
              type: string
        step_group:
          type: object
          nullable: true
          description: |
            The step group the step is in, or null for a scenario's step. Read
            it with `describeScenario` using this id.
          properties:
            id:
              type: integer
            name:
              type: string
        action_type:
          type: string
          nullable: true
          description:
            The step's keyword in enum form, as `describeScenario` reports
            it.
        matched_arguments:
          type: array
          description: |
            The step's arguments that contain the text, as `describeScenario`
            returns them. An `Execute Step Group` step's `step_group` argument
            keeps only the `overrides` that contain it. This can be empty when
            the match is a stored override that `describeScenario` does not
            report, such as one against an element, or one that repeats the
            value the group already carries.
          items:
            "$ref": "#/components/schemas/ScenarioStepArgument"
        executed_by:
          type: array
          nullable: true
          description: |
            For a step group's step, every scenario in the project with a live
            `Execute Step Group` step that runs the group, which is everything a
            change to the step reaches. Null for a scenario's step.
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
    ResultStepArgument:
      description: |
        An argument to a step of a run. The vocabulary matches `ScenarioStepArgument`;
        which fields are present depends on `type`.
      properties:
        name:
          type: string
          nullable: true
          description: |
            Name of the argument, matching the `name` `listStepKeywords` publishes for
            this keyword's argument in the same slot. Null for a value the run carried
            beyond the arguments the keyword declares.
        type:
          type: string
          enum:
            - text
            - url
            - file
            - element
          description: |
            `text` and `url` carry `value`. `file` carries `file_name`. `element`
            carries `element_id`, `user_locator` and `candidate_locators`.
        value:
          description: |
            The value, for a `text` or `url` argument, and null for a declared slot the
            run did not fill. A boolean argument returns a real boolean, matching what
            `describeScenario` returns for the same step.
          oneOf:
            - type: string
            - type: boolean
        file_name:
          type: string
          nullable: true
          description:
            The uploaded file's name, without the storage path it is kept
            under.
        element_id:
          type: integer
          nullable: true
          description: ID of the Autify element targeted by the step.
        user_locator:
          type: string
          nullable: true
          description: |
            Locator explicitly specified by the user, when present. Null for a password
            field, whose locator can embed the value.
        candidate_locators:
          type: array
          description: |
            Selectors Autify had available going into this run, the same flat list
            `describeScenario` returns for the element. These come from what Autify
            learned on earlier runs, so a step that has never passed has none.
            They work as a set, not as alternatives. When Autify matches on them it
            requires every one to resolve to the same element, so a single one may be
            ambiguous alone and is not safe to pin on its own. Order is the order Autify
            generated them in, and carries no ranking. Empty for a password field, whose
            locators can embed the value.
          items:
            type: string
    ScenarioVariables:
      properties:
        import:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              default_value:
                type: string
        export:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              step_id:
                type: integer
                nullable: true
    ScenarioHistory:
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
          description: |
            When this entry was recorded. For an editor save that is a moment after
            the save, when the entry is written.
        author:
          type: object
          allOf:
            - "$ref": "#/components/schemas/User"
          nullable: true
        latest:
          type: boolean
          description: |
            True on the entry recorded by the most recent save of the scenario's
            steps.
    ScenarioHistoryDetail:
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
          description: |
            When this entry was recorded. For an editor save that is a moment after
            the save, when the entry is written.
        author:
          type: object
          allOf:
            - "$ref": "#/components/schemas/User"
          nullable: true
        latest:
          type: boolean
          description: |
            True when this entry was recorded by the most recent save of the
            scenario's steps.
        name:
          type: string
          description: The scenario's name when this entry was recorded.
        steps:
          type: array
          description: "The scenario's steps at this entry, in execution order.

            "
          items:
            "$ref": "#/components/schemas/ScenarioStep"
        data_table:
          type: array
          description:
            "The scenario's data table at this entry, one entry per row.

            "
          items:
            type: object
        variables:
          "$ref": "#/components/schemas/ScenarioVariables"
    AccessPoint:
      properties:
        name:
          type: string
        last_use:
          type: string
          format: date-time
        creator:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - name
        - creator
        - created_at
        - updated_at
    UrlReplacement:
      properties:
        id:
          type: integer
        test_plan_id:
          type: integer
        pattern_url:
          type: string
        replacement_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - test_plan_id
        - pattern_url
        - replacement_url
        - created_at
        - updated_at
    DeviceTypeEnum:
      type: string
      description: mobile is deprecated and will be replaced by smartphone
      enum:
        - desktop
        - mobile
        - smartphone
        - tablet
        - emulator
    BrowserTypeEnum:
      type: string
      enum:
        - chrome
        - firefox
        - safari
        - edge
        - edge_legacy
        - ie
    TimezoneEnum:
      type: string
      enum:
        - JST
        - UTC
        - Asia/Tokyo
        - Etc/UTC
    OsTypeEnum:
      type: string
      enum:
        - macos
        - linux
        - windows
        - windows_server
        - ios
        - android
    Capability:
      properties:
        id:
          type: integer
        os:
          type: string
        os_version:
          type: string
        browser:
          type: string
        browser_version:
          type: string
        device:
          type: string
        timezone:
          "$ref": "#/components/schemas/TimezoneEnum"
        resolution:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CapabilityOption:
      properties:
        os:
          type: string
        os_type:
          "$ref": "#/components/schemas/OsTypeEnum"
        os_version:
          type: string
        browser:
          type: string
        browser_type:
          "$ref": "#/components/schemas/BrowserTypeEnum"
        browser_version:
          type: string
        device:
          type: string
        device_type:
          "$ref": "#/components/schemas/DeviceTypeEnum"
        unsupported:
          type: boolean
          deprecated: true
          description: "(deprecated)"
    StepKeyword:
      properties:
        keyword:
          type: string
          description: |
            Canonical English name of the keyword, for example `Input Text`. This is
            the name the rest of the API expects, in every workspace language.
        action_type:
          type: string
          description: "The same keyword in enum form, for example `INPUT_TEXT`.

            "
        included_in_plan:
          type: boolean
          description: |
            Whether this workspace's plan includes the keyword. Writing a step whose
            keyword is not included is rejected with 402.
        arguments:
          type: array
          description: |
            The keyword's arguments, in the order they must be supplied. Empty for a
            keyword that takes none.
          items:
            "$ref": "#/components/schemas/StepKeywordArgument"
    StepKeywordArgument:
      properties:
        name:
          type: string
          description: Name of the argument as the scenario editor shows it.
        type:
          type: string
          enum:
            - text
            - url
            - file
            - element
          description: |
            What the argument accepts. `text` is a plain string, `url` an address,
            `file` an uploaded file, and `element` an element on the page.
        element_type:
          type: string
          description: |
            Present only when `type` is `element` and the keyword expects a particular
            kind of element, for example `element_textfield` for Input Text or
            `element_checkbox` for Checkbox Should Be Selected.

            An element is supplied as a locator string whose `css:` or `xpath:` prefix
            is mandatory: a `css:` selector descends into shadow DOM where `xpath:`
            does not, the first match wins if a selector is ambiguous, a selector
            resolving outside `<body>` raises, and the lookup is retried for 30 seconds
            before the step fails.
        required:
          type: boolean
    TestPlan:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TestPlanResult:
      properties:
        id:
          type: integer
        status:
          "$ref": "#/components/schemas/TestPlanResultStatus"
        duration:
          type: integer
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        review_needed:
          type: boolean
        test_plan:
          "$ref": "#/components/schemas/TestPlan"
    TestPlanCapabilityResult:
      properties:
        id:
          type: integer
        capability:
          "$ref": "#/components/schemas/Capability"
        test_case_results:
          type: array
          items:
            "$ref": "#/components/schemas/TestCaseResult"
    TestCaseResult:
      properties:
        id:
          type: integer
        status:
          "$ref": "#/components/schemas/TestCaseResultStatus"
        duration:
          type: integer
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        test_case_id:
          type: integer
          description: ID of the scenario executed.
        project_url:
          type: string
        review_needed:
          type: integer
          description: Number of "Review needed" flags present in the test results.
        number_of_credits_consumed:
          type: integer
          description:
            Number of credits consumed by this test result. (default 0
            for test result created before credit based system)
        import_variables:
          description:
            THIS FEATURE IS FOR LIMITED NUMBER OF CUSTOMERS. Variables
            imported from previously executed test results in a test plan.
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
              set_by:
                type: object
                properties:
                  type:
                    type: string
                  id:
                    type: integer
        export_variables:
          description:
            THIS FEATURE IS FOR LIMITED NUMBER OF CUSTOMERS. Variables
            exported from this test result.
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
    ScenarioTestCaseResult:
      allOf:
        - "$ref": "#/components/schemas/TestCaseResult"
        - type: object
          properties:
            capability:
              allOf:
                - "$ref": "#/components/schemas/Capability"
              nullable: true
    TestCaseResultDetail:
      type: object
      properties:
        id:
          type: integer
        scenario_id:
          type: integer
          description: ID of the scenario (test case) that was executed.
        status:
          "$ref": "#/components/schemas/TestCaseResultStatus"
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        duration:
          type: integer
        project_url:
          type: string
        capability:
          "$ref": "#/components/schemas/Capability"
        steps:
          type: array
          items:
            "$ref": "#/components/schemas/TestCaseResultStep"
    TestCaseResultStep:
      type: object
      properties:
        index:
          type: string
          description: |
            Step number within the executed test case, matching the numbering shown
            in the result UI and returned by `describeResult` (`get_details`). Steps
            inside a step group collapse onto one first-level number and get a
            sub-number, e.g. "1", "2", "3-1", "3-2".
        id:
          type: integer
          description: |
            ID of the scenario step this ran, the same identifier `describeScenario`
            returns as a step's `id`.
        composite_id:
          type: string
          description:
            Identifier that is unique even when the step runs inside a
            step group.
        name:
          type: string
          description: Human-readable name of the step.
        on_failure:
          type: string
          enum:
            - abort
            - continue
            - ignore
          description: What the run does when this step fails.
        step_execution_type:
          type: string
          enum:
            - scenario_step
            - cleanup_step
          description: |
            Whether the step runs as part of the scenario or as a cleanup step
            afterwards.
        action_type:
          type: string
          description: |
            The action identifier `listStepKeywords` and `describeScenario` also use,
            so a run's step and the scenario step it came from read the same way. A step
            whose keyword the catalog does not have is not returned at all, where
            `describeScenario` keeps it with a null `action_type`; the gap it leaves in
            `index` is the only trace of it here.
        arguments:
          type: array
          description: |
            The step's arguments, in the order `listStepKeywords` gives them for this
            keyword, each carrying the `name` that catalog publishes. A value typed
            into a password field is returned as `******`.
          items:
            "$ref": "#/components/schemas/ResultStepArgument"
        status:
          type: string
          description: Result of the step.
          enum:
            - passed
            - failed
            - skipped
        error_message:
          type: string
          nullable: true
          description: Error message when the step failed.
        match:
          type: object
          nullable: true
          description: |
            How this run found the element. Absent when the step targets no element,
            when the step failed before finding one, and for results captured before
            Autify recorded how it matched.
          properties:
            located_by:
              type: string
              description: |
                How Autify found the element: `user_locator` when it matched the locator
                you specified on the step, `automatic` when Autify matched it for you.
              enum:
                - user_locator
                - automatic
            confidence:
              type: number
              nullable: true
              description: |
                How confident Autify was in the element it matched. Around 1 is an
                exact match; lower means a looser one.
            candidate_locators:
              type: array
              nullable: true
              description: |
                Selectors Autify generated from the element it actually found. These are
                what later runs will match on.
                They work as a set, not as alternatives. When Autify matches on them it
                requires every one to resolve to the same element, so a single one may be
                ambiguous alone and is not safe to pin on its own. Order is the order Autify
                generated them in, and carries no ranking.
              items:
                type: string
        url_events:
          type: array
          description: |
            The URL the browser was on when the step started and when it finished, so a
            step that navigated can be told from one that did not. Only URLs of the
            application under test appear: not the browser's own start page, so the first
            step usually reports just its end, and not Autify's email inbox, which a step
            that opens an email navigates to.
          items:
            type: object
            properties:
              timing:
                type: string
                enum:
                  - stepStart
                  - stepEnd
              url:
                type: string
              at:
                type: integer
                description: Unix timestamp in milliseconds.
        screenshot_url:
          type: string
          nullable: true
          description: |
            A link to the screenshot the worker took of the page during the step.
            Depending on the keyword, it shows the page before the step acted, when
            the step found its element, or after the step finished. Absent when the
            step took none. The link needs no `Authorization` header and stops working
            within an hour, possibly after only a few minutes. Fetch it right away, or
            call this endpoint again for a fresh one.
    Label:
