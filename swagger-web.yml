---
openapi: 3.0.0
info:
  title: Autify API
  version: v1
  description: |
    ## Authorization
    You can authenticate the API by using a personal access token and passing it to the Bearer header. To generate or manage API keys、please visit [your account page](https://app.autify.com/settings).

    If the credentials are invalid or omitted, an error message is returned with status code 401：
    ```
    {
      "errors":[{
        "message": "Bad credentials"
      }]
    }
    ```
servers:
  - url: https://app.autify.com/api/v1/
    description: Production server
paths:
  "/schedules/{schedule_id}":
    post:
      operationId: executeSchedule
      summary: Run a test plan.
      description:
        '"Schedule" is the old name for "Test Plan", so `schedule_id` is
        the test plan''s ID.

        '
      tags:
        - schedule
      security:
        - bearerAuth: []
      parameters:
        - name: schedule_id
          in: path
          required: true
          description:
            "For example, 3 for the following URL: https://app.autify.com/projects/1/test_plans/3

            "
          schema:
            type: integer
      requestBody:
        description: The options to execute a test plan.
        required: false
        content:
          application/json:
            schema:
              type: object
              "$ref": "#/components/schemas/ExecuteScheduleRequest"
      responses:
        "200":
          description: |
            ok

            `123456` in the example response is the test plan result ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: number
                        example: 123456
                      type:
                        type: string
                        example: test_plan_result
                      attributes:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 123456
                    required:
                      - id
                      - type
                      - attributes
                required:
                  - data
        "401":
          description: Bad credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          default: Bad credentials
        "404":
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          default: Not Found
  "/projects/{project_id}/scenarios":
    get:
      operationId: listScenarios
      description: "List scenarios.

        "
      tags:
        - scenario
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          description:
            "For example, 1 for the following URL: https://app.autify.com/projects/1/scenarios

            "
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: The number of page returns.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Scenario"
    post:
      operationId: createScenario
      description: |
        Create an empty scenario, ready to be given steps.

        The scenario is created with no steps. Add them with
        `replaceScenarioSteps`, sending the `version_token` this call returns.
      tags:
        - scenario
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          description:
            "For example, 1 for the following URL: https://app.autify.com/projects/1/scenarios

            "
          schema:
            type: integer
      requestBody:
        description: The scenario to create
        required: false
        content:
          application/json:
            schema:
              type: object
              "$ref": "#/components/schemas/CreateScenarioRequest"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ScenarioDetail"
        "400":
          description: |
            The name is already used by another scenario in the project or is too
            long, or a label could not be attached, for the same reasons
            `updateScenario` gives.
  "/projects/{project_id}/scenarios/{scenario_id}":
    get:
      operationId: describeScenario
      description: |
        Get a scenario, with its steps, data table and variables.

        Each step names its keyword by the canonical English name that
        `listStepKeywords` publishes, and lists its arguments in that keyword's
        argument order. An argument that targets an element carries the locators
        Autify matches it by, rather than a placeholder.

        An `Execute Javascript` step lists its function arguments after its
        keyword's arguments, as `text` arguments named the way its code refers to
        them. A function argument that shares a name with one of the keyword's
        arguments is left out.

        An element whose `user_locator_heals` is true treats `user_locator` as a
        seed: Autify learns the element from it on the next passing run and matches
        it automatically after that. Its `seed_locator` is the selector Autify last
        learned from, and equals `user_locator` once that has happened. An element
        whose `user_locator_heals` is false uses `user_locator` as a pin on every
        run. `replaceScenarioSteps` sets it.

        An `Execute Step Group` step is reported as a reference to its step group
        rather than expanded in place; read the group itself with this endpoint,
        using the `step_group_id` from the step's argument. The values this call
        site substitutes into the group come back beside it, in `overrides`.

        A step recorded on a password field is masked: values typed into it are
        returned as `******` and the element's `candidate_locators` are withheld,
        as on `describeTestCaseResult`.
      tags:
        - scenario
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          description:
            "For example, 1 for the following URL: https://app.autify.com/projects/1/scenarios/2

            "
          schema:
            type: integer
        - name: scenario_id
          in: path
          required: true
          description:
            "For example, 2 for the following URL: https://app.autify.com/projects/1/scenarios/2

            "
          schema:
            type: integer
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ScenarioDetail"
    put:
      operationId: updateScenario
      description: "Update a scenario.

        "
      tags:
        - scenario
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          description:
            "For example, 1 for the following URL: https://app.autify.com/projects/1/scenarios/2

            "
          schema:
            type: integer
        - name: scenario_id
          in: path
          required: true
          description:
            "For example, 2 for the following URL: https://app.autify.com/projects/1/scenarios/2

            "
          schema:
            type: integer
      requestBody:
        description: The scenario to update
        required: true
        content:
          application/json:
            schema:
              type: object
              "$ref": "#/components/schemas/UpdateScenarioRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ScenarioDetail"
        "400":
          description: |
            `on_create` was false and a label name this project does not have was
            supplied, or `on_create` was neither `true` nor `false`, or a label name
            the project would have to create is not a valid label name, or
            `version_token` was sent empty rather than omitted.
        "412":
          description: |
            The scenario changed after the version you named. Read the scenario again and
            retry against the `version_token` you get back.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          default: 412
                        message:
                          type: string
    delete:
      operationId: deleteScenario
      description: |
        Delete a scenario and remove it from every test plan that includes it.

        This can't be undone through the API. Autify support can restore a deleted
        scenario, but it won't rejoin its test plans. Confirm with the user before
        deleting.

        Step groups can't be deleted here. A step group's id gets 404.
      tags:
        - scenario
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          description:
            "For example, 1 for the following URL: https://app.autify.com/projects/1/scenarios/2

            "
          schema:
            type: integer
        - name: scenario_id
          in: path
          required: true
          description:
            "For example, 2 for the following URL: https://app.autify.com/projects/1/scenarios/2

            "
          schema:
            type: integer
        - name: version_token
          in: query
          required: false
          description: |
            The version of the scenario you are deleting, as returned by `version_token`
            when you read it. If anyone changed the scenario's name, description, labels
            or steps since then, you get 412 and the scenario stays. Sending an empty value
            is an error.
          schema:
            type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: string
                example: ok
        "400":
          description: "`version_token` was sent empty rather than omitted.\n"
        "404":
          description:
            "No scenario with this id in this project, or the id belongs
            to a step group.

            "
        "412":
          description: |
            The scenario changed after the version you named. Read the scenario again,
            check you still want it gone, and retry against the `version_token` you get back.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          default: 412
                        message:
                          type: string
  "/projects/{project_id}/steps/search":
    get:
      operationId: searchSteps
      description: |
        Find the steps in a project whose arguments contain some text, without
        reading every scenario.

        The search covers every live step of every scenario and step group in the
        project, ignoring case. It matches the value of a `text` or `url`
        argument, including an `Execute Javascript` step's function arguments,
        and a value an `Execute Step Group` step substitutes into its
        group, as `describeScenario` reports it in `overrides`. With
        `match_on=locators` it matches an element's `user_locator` instead; with
        no `match_on` it matches both. Step names, memos, `seed_locator`,
        `candidate_locators`, file names, data tables and variables are not
        searched.

        A step recorded on a password field is never matched, by its value or
        its locator, and neither is a value a call site substitutes into one.

        Each result is one step, in the order of its scenario or step group and
        then of its position there. A match inside a step group lists the
        scenarios that run the group in `executed_by`, so a change to the group
        reaches all of them. To change a scenario's step, read the scenario with
        `describeScenario` for its `version_token`, then send the steps with
        `replaceScenarioSteps`.
      tags:
        - scenario
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          description:
            "For example, 1 for the following URL: https://app.autify.com/projects/1/scenarios

            "
          schema:
            type: integer
        - name: q
          in: query
          required: true
          description: |
            The text to find. It matches anywhere in a value, ignoring case;
            `%` and `_` are matched literally.
          schema:
            type: string
            minLength: 1
        - name: match_on
          in: query
          required: false
          description: |
            `values` matches argument values only and `locators` matches
            `user_locator` only. Leave it out to match both.
          schema:
            type: string
            enum:
              - values
              - locators
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: The number of page returns.
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
          description:
            The number of items returns. Default number is 30 and up to a
            maximum of 100
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/StepSearchHit"
        "400":
          description: |
            `q` is missing or empty, `match_on` is neither `values` nor
            `locators`, or the search took too long. Text that appears in most
            steps can take too long; search for something more specific, or
            narrow it with `match_on`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                        message:
                          type: string
        "404":
          description: The project does not exist or is not yours.
  "/projects/{project_id}/scenarios/{scenario_id}/steps":
    put:
      operationId: replaceScenarioSteps
      description: |
        Replace a scenario's steps. Send the whole list in the order the steps should
        run; one call adds, edits, removes and reorders steps.

        A step that carries an `id` from `describeScenario` is that existing step. A
        step without an `id` is added. An existing step whose `id` is not in the list
        is removed, so send `[]` to remove every step.

        Each step and each of its arguments is a JSON merge patch against what
        `describeScenario` returned. A field you send that differs from the current
        value is changed, a field you leave out is kept, and `null` clears it. So
        `{"id": 12}` keeps step 12 exactly as it is, at its new position, and sending
        the read back unchanged changes nothing. Arguments are matched by `name`, as
        `listStepKeywords` names them, so send only the arguments you change. An
        `Execute Javascript` step's function arguments are matched by the names
        `describeScenario` reports for them. Send a name the step lacks to add a
        function argument, and `"value": null` to remove one. To rename one, remove
        the old name and add the new one in the same request.

        A new step needs an `action_type` from `listStepKeywords` and that keyword's
        required arguments. Sending a different `action_type` for an existing step
        rewrites it for the new keyword, keeping its `id` and carrying over the
        arguments whose names the two keywords share.

        When you write a `user_locator`, send `user_locator_heals: true` with it
        unless the step must use that exact selector on every run. Autify then finds
        the element by your selector on the next passing run, learns the element from
        that run and matches it from then on the way it matches a recorded step, so a
        later page change does not break the step. Your selector only has to pick out
        the element on the page as it is now. Left false, the selector is a pin, and
        the step fails once the selector stops matching.

        Read the scenario again from the response: it has the new steps' ids and the
        `version_token` for your next write.
      tags:
        - scenario
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          description:
            "For example, 1 for the following URL: https://app.autify.com/projects/1/scenarios/2

            "
          schema:
            type: integer
        - name: scenario_id
          in: path
          required: true
          description:
            "For example, 2 for the following URL: https://app.autify.com/projects/1/scenarios/2

            "
          schema:
            type: integer
      requestBody:
        description: The scenario's steps, in the order they should run
        required: true
        content:
          application/json:
            schema:
              type: object
              "$ref": "#/components/schemas/ReplaceScenarioStepsRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ScenarioDetail"
        "400":
          description: |
            The steps could not be written, and none were. A problem with one step
            starts the message with that step's position, as `steps[<index>]: `: an
            `id` that is not a step of this scenario or appears twice, an entry that is
            not a step object, a new step without an `action_type`, an argument name
            the keyword does not have, a required argument left empty, a
            `user_locator` without its `css:` or `xpath:` prefix, a step group of
            another project, or a keyword that can only be recorded. A problem with the
            request as a whole carries no position: a body that is not JSON, `steps`
            missing or not a list, removing a step an export variable reads from,
            writing the steps of a step group, which cannot be written through the
            API, or `version_token` sent empty rather than omitted.
        "402":
          description: |
            A step uses a keyword, or is a cleanup step, that this workspace's plan
            does not include. `listStepKeywords` reports which keywords it includes.
            Nothing was written.
        "412":
          description: |
            The scenario changed after the version you named. Read the scenario again,
            reapply your change and retry against the `version_token` you get back.
            Nothing was written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          default: 412
                        message:
                          type: string
  "/projects/{project_id}/scenarios/{scenario_id}/duplications":
    post:
      operationId: duplicateScenario
      description: "Duplicate a scenario.

        "
      tags:
        - scenario
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          description:
            "For example, 1 for the following URL: https://app.autify.com/projects/1/scenarios/2

            "
          schema:
            type: integer
        - name: scenario_id
          in: path
          required: true
          description:
            "For example, 2 for the following URL: https://app.autify.com/projects/1/scenarios/2

            "
          schema:
            type: integer
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ScenarioDetail"
        "402":
          description: |
            The scenario has steps this workspace's plan does not include, so no
            copy was made. `message` names every blocked step in one sentence, so a
            single request tells you everything to remove or upgrade. Duplicating
            counts as writing every step again, so a scenario that still has a step
            from an earlier plan cannot be duplicated even though it can still be
            edited.
            `listStepKeywords` shows which keywords the plan includes. Retrying will
            not succeed until the plan changes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          default: 402
                        message:
                          type: string
  "/projects/{project_id}/scenarios/{scenario_id}/histories":
    get:
      operationId: listScenarioHistories
      description: |
        List a scenario's history, newest first.

        Each save of the scenario's steps in the scenario editor records the whole
        scenario as it stood after that save, as one entry, and so does creating it
        by import, copy or `duplicateScenario`. An editor save's entry is written a
        moment after the save, not with it; the others are written with it.
        Changing only the name, description or labels, which is all
        `updateScenario` changes, records no entry.

        Use this to see when a scenario's steps changed and who changed them, then
        read an entry with `describeScenarioHistory` to see what it held. Comparing
        two entries shows what a save changed.

        `latest` is true on the entry recorded by the most recent save of the
        steps, and holds the steps as last saved. The entry listed after it is the
        version before that save. A passing run, or a locator update made from a
        test result, changes an element's candidate locators without recording an
        entry, so `describeScenario` can differ from `latest` there.
      tags:
        - scenario
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          description:
            "For example, 1 for the following URL: https://app.autify.com/projects/1/scenarios/2

            "
          schema:
            type: integer
        - name: scenario_id
          in: path
          required: true
          description:
            "For example, 2 for the following URL: https://app.autify.com/projects/1/scenarios/2

            "
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: The number of page returns.
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
          description:
            The number of items returns. Default number is 30 and up to a
            maximum of 100
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/ScenarioHistory"
        "404":
          description: The scenario is not in this project.
  "/projects/{project_id}/scenarios/{scenario_id}/histories/{history_id}":
    get:
      operationId: describeScenarioHistory
      description: |
        Get the steps, data table and variables a scenario held at one entry of its
        history, as listed by `listScenarioHistories`.

        They come back in the same shape `describeScenario` returns, so an entry
        can be compared field by field with the scenario as it is now or with
        another entry. Password masking applies as it does there. Five things
        differ, because an entry records values rather than the rows they lived in:

        - An element argument's `element_id`, `user_locator_heals` and
          `seed_locator` are always null, because an entry records none of them.
          Its `user_locator` and `candidate_locators` are the ones the element had
          at that save.
        - A step's `id` is the id it had at that save, which may no longer exist
          in the scenario. It is null on entries saved before late July 2024,
          when entries started recording step ids.
        - An `Execute Step Group` step's `overrides` are read against the step
          group as it is now, so an override on a step since removed from the
          group is not reported.
        - An export variable set by a step inside a step group resolves its
          `step_id` against that group as it is now. When more than one called
          group assigns the same identifier, the step with the lowest id wins.
        - An entry records the scenario's name at that save but not its
          description or labels, and a later rename does not move it.
      tags:
        - scenario
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          description:
            "For example, 1 for the following URL: https://app.autify.com/projects/1/scenarios/2

            "
          schema:
            type: integer
        - name: scenario_id
          in: path
          required: true
          description:
            "For example, 2 for the following URL: https://app.autify.com/projects/1/scenarios/2

            "
          schema:
            type: integer
        - name: history_id
          in: path
          required: true
          description:
            "The `id` of an entry `listScenarioHistories` returned for this
            scenario.

            "
          schema:
            type: integer
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ScenarioHistoryDetail"
        "404":
          description: |
            The scenario is not in this project, or the entry is not in this
            scenario's history.
  "/projects/{project_id}/scenarios/{scenario_id}/histories/{history_id}/restore":
    post:
      operationId: restoreScenarioHistory
      description: |
        Restore a scenario to one entry of its history, as listed by
        `listScenarioHistories`. The scenario is overwritten with what the entry
        holds: its name, steps, data table, variables, options and resolution. Its
        description and labels are kept, because an entry does not record them.

        Steps come back as they were at that save, recorded steps included:

        - A step still in the scenario keeps its `id`. A step removed since comes
          back under the `id` it had. A step added since is removed. Entries saved
          before late July 2024 record no step ids, so their steps get new ones.
        - An element comes back with the `candidate_locators` it had at that save,
          so whatever Autify learned about it from runs since then is lost. Its
          `user_locator_heals` goes back to false and its `seed_locator` is
          cleared, because an entry records neither.

        Restoring an entry that already matches the scenario changes nothing and
        returns the same `version_token`. Any other restore records a new entry in
        `listScenarioHistories`, so it can be undone by restoring the entry listed
        after it. When the scenario as it stands has no entry yet, because the
        entry for a recent write is still being saved, the restore records that
        state first.

        Read the scenario from the response: it has the restored steps and the
        `version_token` for your next write.
      tags:
        - scenario
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          description:
            "For example, 1 for the following URL: https://app.autify.com/projects/1/scenarios/2

            "
          schema:
            type: integer
        - name: scenario_id
          in: path
          required: true
          description:
            "For example, 2 for the following URL: https://app.autify.com/projects/1/scenarios/2

            "
          schema:
            type: integer
        - name: history_id
          in: path
          required: true
          description:
            "The `id` of an entry `listScenarioHistories` returned for this
            scenario.

            "
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              "$ref": "#/components/schemas/RestoreScenarioHistoryRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ScenarioDetail"
        "400":
          description: |
            Nothing was restored. The scenario is a step group, which cannot be
            written through the API; another scenario of this project has taken
            the entry's name since; an email address group the entry's steps use
            has been deleted; or `version_token` was sent empty rather than
            omitted.
        "402":
          description: |
            The entry has a keyword, or a cleanup step, that this workspace's plan
            does not include and the scenario does not already have. The message
            names each one. Nothing was restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          default: 402
                        message:
                          type: string
        "404":
          description: |
            The scenario is not in this project, or the entry is not in this
            scenario's history.
        "412":
          description: |
            The scenario changed after the version you named. Read it again and
            decide whether to restore against the `version_token` you get back.
            Nothing was restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          default: 412
                        message:
                          type: string
