  "/projects/{project_id}/results/{result_id}/rerun":
    post:
      operationId: rerunFailedTestCases
      summary: Rerun the failed test cases of a test result.
      description: |
        Start a new test result that reruns every test case of this result that
        failed or ended in an internal error, the same rerun the "Rerun failed
        tests" button starts. Each test case runs with the data table row and the
        imported variable values it ran with originally, and the new result records
        this one as the result it reruns. It reruns even if someone edited a failed
        scenario since, so you can rerun the test cases to check your fix.

        Prefer this over `executeScenarios` when you are fixing the failures of a
        test plan's result. The rerun belongs to the test plan and runs with the
        plan's capabilities and settings, so the plan's results record its passes.
        `executeScenarios` starts a result outside the test plan, and the plan's
        latest result stays failed.

        To rerun only some of the failed scenarios, use `executeScenarios` instead.
        That starts a separate result, without the original's data table rows or
        imported values.

        Poll the returned `result_id` with `describeResult` to follow the rerun.
      tags:
        - result
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          description:
            "For example, 1 for the following URL: https://app.autify.com/projects/1/results/4

            "
          schema:
            type: integer
        - name: result_id
          in: path
          required: true
          description:
            "For example, 4 for the following URL: https://app.autify.com/projects/1/results/4

            "
          schema:
            type: integer
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                "$ref": "#/components/schemas/ExecuteScenariosResult"
        "400":
          description: |
            The test plan has no capabilities, or uses a capability or timezone that
            this workspace's plan no longer supports. Nothing was started.
        "404":
          description: Not found
        "422":
          description: |
            This result can't be rerun, and the message says why: the result didn't
            fail, reruns aren't enabled for the workspace, every failed scenario was
            deleted or removed from the test plan, or someone deleted a data table a
            failed test case ran with. Nothing was started.
        "429":
          description: |
            The workspace doesn't have enough test runs left. Autify counts the test
            runs of the whole test plan, not only the failed test cases, so you can
            get 429 with enough runs left for the failures alone.
  "/projects/{project_id}/test_case_results/{test_case_result_id}":
    get:
      operationId: describeTestCaseResult
      summary: Get the steps and element locators of a test case result.
      description: |
        Get the step-by-step breakdown of a single test case result, including the
        element locators Autify resolved for each step.

        A "test case result" is the execution of one scenario on one capability.
        You can obtain its ID from the `test_plan_capability_results[].test_case_results[].id`
        field returned by `describeResult`.

        Use this to see which step failed and why, and to read back the locators
        Autify generated for an element, which are usually better than a selector
        you would write by hand.

        To see what the page looked like, fetch a step's `screenshot_url`. On a
        failed step, compare its screenshot with the one from the step before it.

        Note: a step reports its keyword as `action_type`, the same enum
        `listStepKeywords` and `describeScenario` use, rather than as a name. The
        localized label the UI shows appears only in `describeResult` (`get_details`).

        Values typed into a password field are returned as `******`.
      tags:
        - result
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          description:
            "For example, 1 for the following URL: https://app.autify.com/projects/1/results/4

            "
          schema:
            type: integer
        - name: test_case_result_id
          in: path
          required: true
          description: |
            The ID of the test case result. Obtainable from the `test_case_results[].id`
            field of `describeResult`.
          schema:
            type: integer
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TestCaseResultDetail"
